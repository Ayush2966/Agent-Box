name: ci
on: [push, pull_request]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.24' }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: web/package-lock.json }
      - run: cd web && npm ci && npm run check && npm run build
      - run: go vet ./...
      - run: go test -race ./...
      - run: go test -tags e2e ./e2e/...

  # The Go side must build and pass without a dashboard build present.
  go-without-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.24' }
      - run: test ! -f internal/ui/dist/index.html
      - run: go vet ./... && go test -race ./... && CGO_ENABLED=0 go build ./cmd/agentbox

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AGENTBOX_TEST_PG_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.24' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client-16
      - run: go test -race ./internal/db/...
      - run: go test -tags e2e -run Postgres ./e2e/...

  mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env: { MYSQL_ROOT_PASSWORD: root }
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h127.0.0.1 -uroot -proot" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      AGENTBOX_TEST_MYSQL_URL: mysql://root:root@127.0.0.1:3306/mysql
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.24' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: sudo apt-get update && sudo apt-get install -y mysql-client
      - run: go test -race ./internal/db/...
      - run: go test -tags e2e -run MySQL ./e2e/...

  docker:
    runs-on: ubuntu-latest
    env:
      AGENTBOX_TEST_DOCKER: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.24' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: docker compose version
      - run: go test -race ./internal/compose/... ./internal/box/...
      - run: go test -tags e2e -run Compose ./e2e/...

  desktop:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.24' }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: web/package-lock.json }
      - run: go test -race ./internal/desktop/...
      - run: make desktop DESKTOP_ARCHS="arm64 amd64"
      - run: CGO_ENABLED=1 CGO_LDFLAGS="-framework UniformTypeIdentifiers" go vet -tags desktop,production ./cmd/agentbox-desktop/
      - run: lipo -info build/agentbox-desktop && plutil -lint build/Agentbox.app/Contents/Info.plist && test -f build/Agentbox.app/Contents/Resources/agentbox.icns
      - run: codesign --verify --strict --verbose=2 build/Agentbox.app
      - run: ditto -c -k --keepParent build/Agentbox.app build/Agentbox-0.0.0-macos-universal.zip
      # The release writes the app's Homebrew cask from a template; render it here so a broken template fails CI, not a release.
      - run: sh desktop/publish-cask.sh render build/Agentbox-0.0.0-macos-universal.zip 0.0.0 | ruby -c
      - uses: actions/upload-artifact@v4
        with: { name: Agentbox.app, path: build/Agentbox-0.0.0-macos-universal.zip }
