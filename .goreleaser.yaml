version: 2
# The repository is Agent-Box; the tool, its binary, archives and cask are agentbox.
project_name: agentbox
before:
  hooks:
    - sh -c "cd web && npm ci && npm run build"
builds:
  - main: ./cmd/agentbox
    binary: agentbox
    env: [CGO_ENABLED=0]
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    ldflags: ["-s -w -X github.com/Ayush2966/Agent-Box/internal/cli.Version={{.Version}}"]
archives:
  - formats: [tar.gz]
checksum:
  name_template: checksums.txt
homebrew_casks:
  - name: agentbox
    repository: { owner: Ayush2966, name: homebrew-tap, token: "{{ .Env.HOMEBREW_TAP_TOKEN }}" }
    homepage: https://github.com/Ayush2966/Agent-Box
    description: Isolated dev environments for parallel AI coding agents
    # The binary is unsigned, so the quarantine flag Homebrew puts on the download
    # must come off or macOS refuses to run it. hooks.post.install would render the
    # legacy `postflight` block that Homebrew 7 warns about on every install;
    # custom_block carries the steps form instead (GoReleaser v2.19's
    # hooks.post.install_steps can replace it). chdir "." is the staged download.
    # GoReleaser puts custom_block before `version`, which `brew style` flags as
    # stanza order; nothing else minds.
    custom_block: |
      on_macos do
        postflight_steps do
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "agentbox"], chdir: "."
        end
      end
